<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clocked In</title>
<meta name="description" content="Track work hours with friends — clock in with one tap, daily photo, weekly leaderboard.">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F6F4; --card:#FFFFFF; --ink:#141414; --sub:#73787D; --line:#E9E9E6;
    --acc:#0D8050; --acc-soft:#E7F3EE; --gold:#B98A1F; --gold-soft:#FBF4E4;
    --danger:#C7402F; --shadow:0 1px 3px rgba(15,20,16,.06), 0 1px 2px rgba(15,20,16,.04);
    color-scheme: light;
  }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', -apple-system, 'Segoe UI', sans-serif;
    font-size:15px; line-height:1.5; -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; border-radius:6px; }
  input{ font:inherit; color:var(--ink); }
  img{ max-width:100%; display:block; }
  .num{ font-variant-numeric:tabular-nums; }

  .app{ max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }

  /* header */
  .hdr{ position:sticky; top:0; z-index:40; background:var(--bg); }
  .hdr-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 10px; }
  .brand{ font-weight:800; font-size:21px; letter-spacing:-.03em; display:flex; align-items:center; gap:8px; user-select:none; }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--acc); }
  .hdr-chips{ display:flex; align-items:center; gap:8px; }
  .chip-code{ font-size:12px; font-weight:600; color:var(--sub); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 11px; letter-spacing:.02em; }
  .chip-mode{ font-size:11px; font-weight:500; color:var(--sub); }

  /* layout */
  .view{ flex:1; padding:6px 16px 96px; display:flex; flex-direction:column; gap:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); }
  .pad{ padding:16px 18px; }
  .sec{ font-size:13px; font-weight:600; color:var(--sub); margin:8px 6px -6px; }

  /* tabs */
  .tabs{ position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:center; }
  .tabs-inner{ display:flex; width:100%; max-width:520px; }
  .tab{ flex:1; padding:10px 0 max(10px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--sub); font-size:11px; font-weight:500; }
  .tab svg{ width:23px; height:23px; }
  .tab[aria-current="true"]{ color:var(--ink); font-weight:600; }

  /* home hero */
  .hero{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:28px 18px 24px; text-align:center; }
  .hero-status{ font-size:13px; font-weight:500; color:var(--sub); }
  .timer{ font-size:40px; font-weight:700; letter-spacing:-.02em; }
  .btn{ border-radius:999px; font-weight:600; font-size:16px; padding:14px 34px; transition:transform .06s ease, opacity .15s ease; }
  .btn:active{ transform:scale(.98); }
  .btn-in{ background:var(--acc); color:#fff; }
  .btn-out{ background:var(--ink); color:#fff; }
  .btn-sec{ background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:14px; padding:10px 20px; }
  .btn-quiet{ color:var(--sub); font-size:14px; font-weight:500; padding:8px 12px; }
  .hero-sub{ display:flex; gap:22px; font-size:13px; color:var(--sub); }
  .hero-sub strong{ color:var(--ink); font-weight:600; }

  /* rows */
  .row{ display:flex; align-items:center; gap:13px; padding:13px 18px; border-top:1px solid var(--line); }
  .row:first-child{ border-top:none; }
  .avatar{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; color:#fff; flex:none; }
  .avatar.sm{ width:32px; height:32px; font-size:13px; }
  .r-main{ flex:1; min-width:0; }
  .r-name{ font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:6px; }
  .r-sub{ font-size:12.5px; color:var(--sub); }
  .r-end{ text-align:right; }
  .r-hours{ font-weight:600; font-size:15px; }
  .live{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--acc); animation:pulse 2.4s infinite; }
  .off{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--line); }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @media (prefers-reduced-motion: reduce){ .live{ animation:none; } *{ transition:none !important; } }

  .act{ display:flex; gap:10px; padding:9px 18px; border-top:1px solid var(--line); font-size:13px; color:var(--sub); }
  .act:first-child{ border-top:none; }
  .act time{ flex:none; font-weight:500; }

  .banner{ background:var(--gold-soft); border:1px solid #EFE2C0; border-radius:14px; padding:12px 16px; font-size:13.5px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .banner .btn-sec{ padding:7px 14px; font-size:13px; }

  /* pills & tags */
  .tag{ font-size:11px; font-weight:600; border-radius:999px; padding:3px 9px; }
  .tag.ok{ color:var(--acc); background:var(--acc-soft); }
  .tag.late{ color:var(--sub); background:var(--bg); border:1px solid var(--line); }
  .tag.gold{ color:var(--gold); background:var(--gold-soft); }

  /* feed */
  .mc-card{ text-align:center; padding:22px 18px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .mc-title{ font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .mc-sub{ font-size:13.5px; color:var(--sub); max-width:36ch; }
  .countdown{ font-size:34px; font-weight:700; }
  .post{ overflow:hidden; }
  .post-head{ display:flex; align-items:center; gap:11px; padding:12px 16px; }
  .post-photos{ position:relative; background:var(--bg); }
  .post-desk{ width:100%; aspect-ratio:3/4; object-fit:cover; }
  .post-selfie{ position:absolute; top:12px; left:12px; width:28%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; border:2px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .post-gone{ aspect-ratio:4/1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; }
  .blurred .post-desk, .blurred .post-selfie{ filter:blur(18px); }
  .blur-note{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:13.5px; font-weight:500; color:#fff; background:rgba(20,20,20,.35); padding:0 24px; }
  .reacts{ display:flex; gap:8px; padding:10px 14px; }
  .react{ border:1px solid var(--line); border-radius:999px; padding:5px 13px; font-size:14px; display:flex; gap:6px; align-items:center; background:var(--card); }
  .react.mine{ border-color:var(--acc); background:var(--acc-soft); }
  .react .c{ font-size:12px; font-weight:600; color:var(--sub); }
  .day{ font-size:13px; font-weight:600; color:var(--sub); margin:10px 6px -6px; }

  /* board */
  .lg-row{ display:flex; align-items:center; gap:13px; padding:13px 18px; border-top:1px solid var(--line); }
  .lg-row:first-child{ border-top:none; }
  .lg-rank{ width:20px; font-size:13px; font-weight:600; color:var(--sub); flex:none; text-align:center; }
  .lg-bar{ height:6px; border-radius:999px; background:var(--bg); margin-top:6px; overflow:hidden; }
  .lg-fill{ height:100%; border-radius:999px; background:var(--acc); min-width:4px; }
  .winner-card{ display:flex; align-items:center; gap:14px; padding:16px 18px; background:linear-gradient(135deg, #FDF8EC, #FBF2DC); border:1px solid #EFE2C0; border-radius:18px; }
  .winner-cup{ font-size:28px; }
  .winner-t{ font-size:12.5px; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:.06em; }
  .winner-n{ font-weight:700; font-size:16px; }
  .winner-h{ margin-left:auto; font-weight:700; font-size:18px; }

  /* profile */
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); }
  .tile-v{ font-size:24px; font-weight:700; letter-spacing:-.01em; }
  .tile-l{ font-size:12px; font-weight:500; color:var(--sub); margin-top:1px; }
  .chart{ display:flex; align-items:flex-end; gap:10px; height:100px; padding:8px 4px 0; border-bottom:1px solid var(--line); }
  .bar-w{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; position:relative; }
  .bar{ width:60%; max-width:22px; background:var(--acc); border-radius:4px 4px 0 0; min-height:2px; }
  .bar-w:hover .bar, .bar-w:focus .bar{ opacity:.75; }
  .chart-x{ display:flex; gap:10px; padding:5px 4px 0; }
  .chart-x span{ flex:1; text-align:center; font-size:10.5px; font-weight:500; color:var(--sub); }
  .tip{ position:absolute; bottom:calc(100% + 5px); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:11px; font-weight:500; padding:4px 8px; border-radius:6px; white-space:nowrap; display:none; z-index:5; }
  .bar-w:hover .tip, .bar-w:focus .tip{ display:block; }
  .badges{ display:flex; flex-wrap:wrap; gap:8px; padding:14px 16px; }
  .badge{ border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:500; display:flex; gap:7px; align-items:center; }
  .p-head{ display:flex; align-items:center; gap:14px; padding:18px; }
  .p-head .avatar{ width:56px; height:56px; font-size:22px; }
  .p-name{ font-weight:700; font-size:18px; letter-spacing:-.01em; }
  .p-sub{ font-size:13px; color:var(--sub); }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:12px; font-weight:600; color:var(--sub); }
  .field input{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:15px; }
  .row-btns{ display:flex; gap:9px; flex-wrap:wrap; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 18px; border-top:1px solid var(--line); font-size:14.5px; }
  .settings-row:first-child{ border-top:none; }
  .settings-row .btn-sec{ flex:none; }

  /* overlays */
  .scrim{ position:fixed; inset:0; z-index:60; background:rgba(20,20,20,.45); display:flex; align-items:flex-end; justify-content:center; }
  .scrim.center{ align-items:center; padding:24px; }
  .sheet{ background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:520px; max-height:92dvh; overflow:auto; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); }
  .scrim.center .sheet{ border-radius:22px; }
  .sheet h2{ font-size:18px; font-weight:700; letter-spacing:-.01em; margin:0 0 8px; }
  .sheet p{ margin:0 0 14px; color:var(--sub); font-size:14px; }
  .cam-stage{ position:fixed; inset:0; z-index:80; background:#000; display:flex; flex-direction:column; }
  .cam-stage video{ flex:1; object-fit:cover; width:100%; min-height:0; }
  .cam-bar{ padding:16px 16px calc(18px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; gap:24px; background:#000; }
  .cam-label{ position:absolute; top:18px; left:0; right:0; text-align:center; color:#fff; font-weight:600; font-size:14px; text-shadow:0 1px 4px rgba(0,0,0,.6); z-index:2; }
  .shutter{ width:64px; height:64px; border-radius:50%; border:4px solid #fff; background:transparent; }
  .shutter:active{ background:#fff3; }
  .cam-cancel{ color:#ccc; font-size:14px; font-weight:500; }
  .rv-wrap{ flex:1; position:relative; min-height:0; background:#111; }
  .rv-desk{ width:100%; height:100%; object-fit:cover; }
  .rv-selfie{ position:absolute; top:12px; left:12px; width:28%; border-radius:12px; border:2px solid #fff; }
  .toasts{ position:fixed; left:0; right:0; bottom:80px; z-index:90; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px; }
  .toast{ background:var(--ink); color:#fff; font-size:13.5px; font-weight:500; padding:10px 18px; border-radius:999px; box-shadow:0 4px 16px rgba(0,0,0,.18); max-width:100%; text-align:center; }
  .hidden{ display:none !important; }
  .center-t{ text-align:center; }
  .muted{ color:var(--sub); }
  .small{ font-size:13px; }
</style>

<div class="app" id="app">
  <header class="hdr">
    <div class="hdr-row">
      <div class="brand"><span class="dot" aria-hidden="true"></span>Clocked In</div>
      <div class="hdr-chips">
        <span class="chip-mode" id="modeChip"></span>
        <span class="chip-code num" id="floorCode"></span>
      </div>
    </div>
  </header>
  <main class="view" id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Sections"><div class="tabs-inner" id="tabs"></div></nav>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>
<script type="application/json" id="seed">null</script>

<script>
/* ── SHARED FLOOR CONFIG ─────────────────────────────────────────────
   Optional: paste your Firebase Realtime Database URL between the
   quotes to enable the shared group for everyone with the link, e.g.
     window.CLOCKEDIN_DB = "https://your-project-default-rtdb.firebaseio.com";
   You can also connect it from inside the app (Profile → Group) or via
   a link carrying #db=<url> — no file editing needed.
   Setup guide: CLOCKED-IN-SETUP.md in this repo.                     */
window.CLOCKEDIN_DB = null;
</script>

<script>
(function(){
'use strict';

/* ───────────────────────── state & persistence ───────────────────────── */

var ART=null, DL=null, MODE='solo', HTML_FALLBACK=false;
var S=null, ME=null, TAB='home';
var SAVING=false, DIRTY=false, SAVE_TIMER=null;
var DB=null, FLOOR=null, PENDING={}, FLUSHING=false, ES=null, POLL=null, SHREDDED=false, OFFLINE=false;

var LS_STATE='clockedin.state', LS_STATE_R='clockedin.state.remote', LS_STATE_A='clockedin.state.art',
    LS_ME='clockedin.me', SS_DRAFT='clockedin.draft', LS_PEND='clockedin.pending',
    LS_DB='clockedin.db', LS_FLOOR='clockedin.floor', LS_CHEER='clockedin.cheer';
var AV_COLORS=['#0D8050','#2563EB','#D97706','#DB2777','#7C3AED','#0891B2','#DC2626','#4D7C0F'];
var REACT_SET=['👍','❤️','😂'];
var BADGE_DEFS={
  earlybird:{e:'☀️',n:'Early Bird',d:'Clocked in before 6:30 AM.'},
  nightowl:{e:'🌙',n:'Night Owl',d:'Clocked out after 10:30 PM.'},
  allnighter:{e:'🌒',n:'All-Nighter',d:'Clocked out past midnight.'},
  marathon:{e:'🏁',n:'Marathon',d:'A 10-hour day.'},
  club13:{e:'🔩',n:'13 Club',d:'A 13-hour day. Respect.'}
};

function nowMs(){ return Date.now(); }
function dstr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hstr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rnd01(seedStr){ var a=hstr(seedStr); a=Math.imul(a^a>>>15, a|1); a^=a+Math.imul(a^a>>>7, a|61); return ((a^(a>>>14))>>>0)/4294967296; }

function defaultState(){
  return { v:2,
    ws:{ name:'My group', code:Math.random().toString(36).slice(2,8).toUpperCase(), seed:Math.floor(Math.random()*1e9) },
    members:{}, sessions:{}, posts:{}, log:{} };
}
function normalize(){
  S=S||{}; S.v=S.v||2;
  S.ws=S.ws||{ name:'My group', code:FLOOR||'GROUP', seed:FLOOR?hstr(FLOOR):0 };
  S.members=S.members||{}; S.sessions=S.sessions||{}; S.posts=S.posts||{}; S.log=S.log||{};
  if(Array.isArray(S.log)){ var o={}; S.log.forEach(function(e,i){ o['l0'+String(i).padStart(6,'0')]=e; }); S.log=o; }
  Object.keys(S.members).forEach(function(id){ S.members[id].badges=S.members[id].badges||{}; });
  /* sessions are keyed maps {key:{i,o}} — stable across devices; legacy arrays migrate */
  Object.keys(S.sessions).forEach(function(id){
    var v=S.sessions[id];
    if(Array.isArray(v)){ var o={}; v.forEach(function(s,i){ if(s) o['a'+String(i).padStart(4,'0')]=s; }); S.sessions[id]=o; }
    else if(!v||typeof v!=='object') S.sessions[id]={};
  });
}
function loadKey(k){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function loadLocalState(){ return loadKey(LS_STATE); }
function stateKey(){ return MODE==='remote'?LS_STATE_R : MODE==='shared'?LS_STATE_A : LS_STATE; }
function seedState(){ try{ var el=document.getElementById('seed'); var j=JSON.parse(el.textContent); return j&&j.v?j:null; }catch(e){ return null; } }

async function loadState(){
  if(ART){
    try{
      var r=await fetch('data/state.json',{cache:'no-store'});
      if(r.ok){ var j=await r.json(); if(j&&j.v) return j; }
    }catch(e){}
    var sd=seedState(); if(sd) return sd;
  }
  return loadKey(LS_STATE_A)||loadLocalState()||defaultState();
}
function loadMe(){ try{ var m=JSON.parse(localStorage.getItem(LS_ME)); if(m&&m.id&&S.members[m.id]) return m; }catch(e){} return null; }

function jsonSafe(obj){ return JSON.stringify(obj).replace(/</g,'\\u003c'); }
function mirror(){
  try{ localStorage.setItem(stateKey(), JSON.stringify(S)); }
  catch(e){
    try{
      var slim=JSON.parse(JSON.stringify(S));
      Object.keys(slim.posts||{}).forEach(function(ds){ Object.keys(slim.posts[ds]).forEach(function(id){ slim.posts[ds][id].selfie=null; slim.posts[ds][id].desk=null; }); });
      localStorage.setItem(stateKey(), JSON.stringify(slim));
    }catch(e2){}
  }
}

function pruneOld(hard){
  var keepDays=hard?2:7, cut=new Date(); cut.setDate(cut.getDate()-keepDays);
  var cutS=dstr(cut), shredded=false;
  Object.keys(S.posts).forEach(function(ds){
    if(ds<cutS){ Object.keys(S.posts[ds]).forEach(function(id){
      var p=S.posts[ds][id];
      if(p.selfie||p.desk){ p.selfie=null; p.desk=null; shredded=true; }
    }); }
  });
  var lk=Object.keys(S.log).sort();
  if(lk.length>60) lk.slice(0,lk.length-60).forEach(function(k){ delete S.log[k]; });
  return shredded;
}

function requestSave(){
  pruneOld(false);
  mirror();
  if(MODE!=='shared'||!ART) return;
  if(SAVING){ DIRTY=true; return; }
  doSave();
}
async function doSave(){
  SAVING=true; DIRTY=false;
  try{
    if(HTML_FALLBACK){ await htmlPublish(); }
    else{ await ART.publish({'data/state.json': jsonSafe(S)}); }
  }catch(e){
    var code=e&&e.code;
    if(code==='conflict'){ toast('Syncing latest…'); }
    else if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='consent_required'){ enterReadonly(); }
    else if(code==='capability_disabled'||code==='capability_removed'){
      if(!HTML_FALLBACK){ HTML_FALLBACK=true; SAVING=false; return doSave(); }
      MODE='solo'; setModeChip(); toast('Sharing unavailable here — tracking on this device.');
    }
    else if(code==='rate_limited'){ clearTimeout(SAVE_TIMER); SAVE_TIMER=setTimeout(function(){ SAVING=false; doSave(); },6000); return; }
    else if(code==='too_large'){ if(pruneOld(true)){ SAVING=false; return doSave(); } toast('Storage full — could not save.'); }
    else{ clearTimeout(SAVE_TIMER); SAVE_TIMER=setTimeout(function(){ SAVING=false; if(MODE==='shared') doSave(); },4000); return; }
  }finally{ SAVING=false; }
  if(DIRTY) doSave();
}
async function htmlPublish(){
  var r=await fetch('index.html',{cache:'no-store'});
  if(!r.ok) throw {code:'capability_disabled',message:'no source'};
  var src=await r.text();
  var re=/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/;
  if(!re.test(src)) throw {code:'capability_disabled',message:'no seed block'};
  src=src.replace(re, '$1'+jsonSafe(S)+'$2');
  await ART.publish(src);
}
function enterReadonly(){
  if(MODE==='readonly') return;
  MODE='readonly'; setModeChip(); render();
  toast('This is a read-only view.');
}

/* persist(paths): single entry point for every mutation.
   paths maps RTDB-style subpaths ("members/m1/name") to values (null deletes).
   remote → multi-path PATCH; artifact → whole-state publish; solo → mirror only. */
function persist(paths){
  if(MODE!=='remote') pruneOld(false);
  mirror();
  if(MODE==='remote'){
    for(var k in paths) queuePath(k, paths[k]);
    savePending();
    flushRemote();
  }
  else if(MODE==='shared') requestSave();
}
/* RTDB rejects a multi-path PATCH containing both a path and its descendant,
   so the queue merges children into a pending ancestor (cloned, so an
   in-flight batch is never mutated) and lets a parent supersede its children. */
function queuePath(k,v){
  v=(v===undefined)?null:v;
  for(var a in PENDING){
    if(a!==k && k.indexOf(a+'/')===0){
      var node=PENDING[a];
      node=(node&&typeof node==='object')?JSON.parse(JSON.stringify(node)):{};
      PENDING[a]=node;
      var rest=k.slice(a.length+1).split('/');
      for(var i=0;i<rest.length-1;i++){ var kk=rest[i]; if(node[kk]==null||typeof node[kk]!=='object') node[kk]={}; node=node[kk]; }
      if(v==null) delete node[rest[rest.length-1]]; else node[rest[rest.length-1]]=v;
      return;
    }
  }
  Object.keys(PENDING).forEach(function(d){ if(d!==k && d.indexOf(k+'/')===0) delete PENDING[d]; });
  PENDING[k]=v;
}
/* the offline queue survives reloads, scoped to this db+group */
function savePending(){
  try{
    if(Object.keys(PENDING).length) localStorage.setItem(LS_PEND, JSON.stringify({db:DB, f:FLOOR, p:PENDING}));
    else localStorage.removeItem(LS_PEND);
  }catch(e){}
}
function loadPending(){
  try{
    var j=JSON.parse(localStorage.getItem(LS_PEND));
    if(j&&j.db===DB&&j.f===FLOOR&&j.p&&typeof j.p==='object') PENDING=j.p;
  }catch(e){}
}
function merged(){ var o={}; for(var i=0;i<arguments.length;i++){ var a=arguments[i]; for(var k in a) o[k]=a[k]; } return o; }
function plog(msg){
  var k='l'+nowMs().toString(36)+Math.random().toString(36).slice(2,5);
  var e={t:nowMs(), msg:msg}; S.log[k]=e;
  var o={}; o['log/'+k]=e; return o;
}
function logEntries(){ return Object.keys(S.log).sort().map(function(k){ return S.log[k]; }); }
function awardP(id,key){
  var m=S.members[id]; if(!m||m.badges[key]||!BADGE_DEFS[key]) return {};
  m.badges[key]=dstr();
  var b=BADGE_DEFS[key], o={}; o['members/'+id+'/badges/'+key]=m.badges[key];
  if(ME&&id===ME.id) toast(b.e+' New badge: '+b.n);

/* ── shared group (Firebase Realtime Database over plain REST) ── */
function rtdbUrl(p){ return DB+'/floors/'+encodeURIComponent(FLOOR)+(p?'/'+p:'')+'.json'; }
function validDb(u){ return /^https?:\/\/[\w.-]+(:\d+)?$/.test(u); }
function resolveRemote(){
  var q,h;
  try{ q=new URLSearchParams(location.search); h=new URLSearchParams(location.hash.replace(/^#\/?/,'')); }
  catch(e){ q=h=new URLSearchParams(''); }
  DB = window.CLOCKEDIN_DB || q.get('db') || h.get('db') || null;
  try{ DB=DB||localStorage.getItem(LS_DB); }catch(e){}
  if(DB){ DB=String(DB).trim().replace(/\/+$/,''); if(!validDb(DB)) DB=null; }
  FLOOR = q.get('floor') || h.get('f') || null;
  try{ FLOOR=FLOOR||localStorage.getItem(LS_FLOOR); }catch(e){}
  if(FLOOR){ FLOOR=String(FLOOR).toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,24)||null; }
  if(DB){ try{ localStorage.setItem(LS_DB,DB); }catch(e){} }
  if(FLOOR){ try{ localStorage.setItem(LS_FLOOR,FLOOR); }catch(e){} }
}
async function remoteLoad(){
  var got=null, down=false;
  try{
    var r=await fetch(rtdbUrl(''),{cache:'no-store'});
    if(r.ok) got=await r.json(); else down=true;
  }catch(e){ down=true; }
  if(down){
    /* stay in remote mode on the last synced copy — SSE/poll/retry heal it */
    S=loadKey(LS_STATE_R)||{ v:2, ws:{name:'My group', code:FLOOR, seed:hstr(FLOOR)}, members:{}, sessions:{}, posts:{}, log:{} };
    OFFLINE=true;
    toast('Can’t reach the group — showing your last synced copy.');
    return;
  }
  if(got){ S=got; }
  else{
    S={ v:2, ws:{name:'My group', code:FLOOR, seed:hstr(FLOOR)}, members:{}, sessions:{}, posts:{}, log:{} };
    try{ await fetch(rtdbUrl('ws'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S.ws)}); }catch(e){}
  }
}
var RETRY_TIMER=null, RETRY_MS=6000;
async function flushRemote(){
  if(FLUSHING) return;
  var keys=Object.keys(PENDING); if(!keys.length) return;
  FLUSHING=true;
  var batch={}; keys.forEach(function(k){ batch[k]=PENDING[k]; });
  var ok=false, status=0;
  try{
    var r=await fetch(rtdbUrl(''),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(batch)});
    ok=r.ok; status=r.status;
  }catch(e){}
  FLUSHING=false;
  if(ok){
    keys.forEach(function(k){ if(PENDING[k]===batch[k]) delete PENDING[k]; });
    savePending();
    RETRY_MS=6000;
    if(OFFLINE){ OFFLINE=false; setModeChip(); toast('Back online — synced.'); }
    if(Object.keys(PENDING).length) flushRemote();
  }else if(status===401||status===403){
    /* rules problem, not connectivity — retrying forever would just lie to the user */
    PENDING={}; savePending();
    toast('The group database rejected the write — check its rules (see setup guide).', 5000);
  }else if(status===400||status===404){
    PENDING={}; savePending();
    toast('The group database refused that change — check the database URL.', 5000);
  }else{
    if(!OFFLINE){ OFFLINE=true; setModeChip(); toast('Offline — changes saved on this device, will sync.'); }
    clearTimeout(RETRY_TIMER);
    RETRY_TIMER=setTimeout(flushRemote, RETRY_MS);
    RETRY_MS=Math.min(60000, Math.round(RETRY_MS*1.6));
  }
}
function applyAt(path, data){
  var parts=String(path).split('/').filter(Boolean);
  if(!parts.length){ S=data||null; normalize(); return; }
  var node=S;
  for(var i=0;i<parts.length-1;i++){
    var k=parts[i];
    if(typeof node[k]!=='object'||node[k]==null) node[k]={};
    node=node[k];
  }
  var last=parts[parts.length-1];
  if(data==null) delete node[last]; else node[last]=data;
}
function afterRemote(){
  normalize();
  var ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return; /* don't wipe what someone is typing */
  if(!document.querySelector('.scrim, .cam-stage')) render();
}
function startStream(){
  if(!window.EventSource){ startPoll(); return; }
  try{ ES=new EventSource(rtdbUrl('')); }catch(e){ startPoll(); return; }
  ES.addEventListener('put',function(ev){
    try{ var m=JSON.parse(ev.data); applyAt(m.path, m.data); applyPendingLocally(); afterRemote(); }catch(e){}
  });
  ES.addEventListener('patch',function(ev){
    try{ var m=JSON.parse(ev.data); var base=String(m.path).replace(/\/+$/,'');
      for(var k in m.data) applyAt(base+'/'+k, m.data[k]);
      applyPendingLocally(); afterRemote(); }catch(e){}
  });
  ES.onerror=function(){
    if(ES && ES.readyState===2){ try{ES.close();}catch(e){} ES=null; startPoll(); }
  };
}
function startPoll(){
  if(POLL) return;
  POLL=setInterval(async function(){
    try{
      var r=await fetch(rtdbUrl(''),{cache:'no-store'});
      if(r.ok){ var j=await r.json(); if(j){ S=j; applyPendingLocally(); afterRemote(); } }
    }catch(e){}
  },15000);
}
function applyPendingLocally(){ for(var k in PENDING) applyAt(k, PENDING[k]); }
function shredRemote(){
  if(SHREDDED) return; SHREDDED=true;
  var cut=new Date(); cut.setDate(cut.getDate()-7);
  var cutS=dstr(cut), o={};
  Object.keys(S.posts).forEach(function(ds){
    if(ds<cutS) Object.keys(S.posts[ds]).forEach(function(id){
      var p=S.posts[ds][id];
      if(p&&(p.selfie||p.desk)){
        p.selfie=null; p.desk=null;
        o['posts/'+ds+'/'+id+'/selfie']=null; o['posts/'+ds+'/'+id+'/desk']=null;
      }
    });
  });
  var lk=Object.keys(S.log).sort();
  if(lk.length>60) lk.slice(0,lk.length-60).forEach(function(k){ delete S.log[k]; o['log/'+k]=null; });
  if(Object.keys(o).length) persist(o);
}
function floorLink(){
  var base=location.href.split('#')[0].split('?')[0];
  var carryDb = !window.CLOCKEDIN_DB && DB ? '&db='+encodeURIComponent(DB) : '';
  return base+'#f='+FLOOR+carryDb;
}
function shareLink(){
  var l=floorLink();
  if(navigator.share){ navigator.share({title:'Clocked In', text:'Join our group on Clocked In', url:l}).catch(function(){}); return; }
  var done=function(){ toast('Invite link copied.'); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(l).then(done,function(){ prompt('Copy the invite link:', l); });
  else prompt('Copy the invite link:', l);
}

/* ───────────────────────── time & hours math ───────────────────────── */

function weekStart(d){ var x=new Date(d||nowMs()); var day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x.getTime(); }
function weekStartN(n){ var x=new Date(weekStart()); x.setDate(x.getDate()-7*n); return x.getTime(); }
function dayStart(d){ var x=new Date(d||nowMs()); x.setHours(0,0,0,0); return x.getTime(); }
function sessList(id){
  var v=S.sessions[id]; if(!v||typeof v!=='object') return [];
  return Object.keys(v).map(function(k){ return v[k]; }).filter(function(s){ return s&&typeof s.i==='number'; });
}
function msIn(id,a,b){
  var t=0, list=sessList(id);
  for(var k=0;k<list.length;k++){ var s=list[k]; var o=(s.o==null)?nowMs():s.o;
    var lo=Math.max(s.i,a), hi=Math.min(o,b); if(hi>lo) t+=hi-lo; }
  return t;
}
function hrs(ms){ return ms/3.6e6; }
function weekH(id){ return hrs(msIn(id, weekStart(), nowMs())); }
function todayH(id){ return hrs(msIn(id, dayStart(), nowMs())); }
function activeSession(id){
  var v=S.sessions[id]||{}, best=null;
  Object.keys(v).forEach(function(k){
    var s=v[k];
    if(s&&typeof s.i==='number'&&s.o==null&&(!best||s.i>best.s.i)) best={k:k, s:s};
  });
  return best;
}
function nextDayStart(t){ var d=new Date(dayStart(t)); d.setDate(d.getDate()+1); return d.getTime(); }
function fmtH(h){ return (Math.round(h*10)/10).toFixed(1)+'h'; }
function fmtDur(ms){ ms=Math.max(0,ms||0); var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function fmtT(ts){
  var d=new Date(ts), h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
  var ap=h<12?'AM':'PM'; h=h%12||12;
  return h+':'+m+' '+ap;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function mcMinutes(ds){ return 510 + Math.floor(rnd01(ds+'|'+(S.ws.seed||0))*780); } /* 08:30–21:30 */
function minsNow(){ var d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; }
function myPost(ds){ return ME && S.posts[ds] && S.posts[ds][ME.id] || null; }
function postStreak(id){
  var n=0, d=new Date();
  if(!(S.posts[dstr(d)]&&S.posts[dstr(d)][id])) d.setDate(d.getDate()-1);
  while(S.posts[dstr(d)]&&S.posts[dstr(d)][id]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function winnerOfWeek(n){ /* n=1 → last week */
  var we=weekStartN(n-1), ws=weekStartN(n), best=null;
  Object.keys(S.members).forEach(function(id){
    var h=hrs(msIn(id,ws,we));
    if(h>0.05&&(!best||h>best.h)) best={id:id, h:h, name:S.members[id].name, ws:ws};
  });
  return best;
}

function guardWrite(){

function clockIn(){
  if(!guardWrite()) return;
  if(activeSession(ME.id)){ render(); return; } /* stale render / second tab */
  var t=nowMs(), d=new Date(t);
  var map=(S.sessions[ME.id]=S.sessions[ME.id]||{});
  var sk='s'+t.toString(36)+Math.random().toString(36).slice(2,5);
  map[sk]={i:t,o:null};
  var m=S.members[ME.id];
  var P={}; P['sessions/'+ME.id+'/'+sk]={i:t};
  P=merged(P, plog(m.name+' clocked in'));
  if(d.getHours()<6 || (d.getHours()===6&&d.getMinutes()<30)){
    P=merged(P, awardP(ME.id,'earlybird'));
    toast('Early start. ☀️');
  } else toast('Clocked in · '+fmtT(t));

}
function clockOut(){
  if(!guardWrite()) return;
  var a=activeSession(ME.id); if(!a){ render(); return; }
  a.s.o=nowMs();
  var dur=a.s.o-a.s.i, m=S.members[ME.id], d=new Date(a.s.o), h=d.getHours();
  var P={}; P['sessions/'+ME.id+'/'+a.k+'/o']=a.s.o;
  P=merged(P, plog(m.name+' clocked out · '+fmtH(hrs(dur))));
  var lines=[];
  if(h<5){ P=merged(P, awardP(ME.id,'allnighter')); lines.push('Past midnight. 🌒'); }
  else if(h>=22 && (h>22||d.getMinutes()>=30)){ P=merged(P, awardP(ME.id,'nightowl')); lines.push('Late one. 🌙'); }
  if(hrs(dur)>=13){ P=merged(P, awardP(ME.id,'club13')); lines.push('13 hours. Go rest.'); }
  else if(hrs(dur)>=10){ P=merged(P, awardP(ME.id,'marathon')); lines.push('10+ hours today. 🏁'); }
  toast(lines[0] || ('Clocked out · '+fmtH(hrs(dur))));
  persist(P); render();
}

    mc='<div class="card mc-card"><div class="mc-title">📸 Photo time</div>'+

/* photos travel through a database anyone in the group can write to —
   only well-formed image data URIs ever reach the DOM */
function safeImg(u){
  return (typeof u==='string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u)) ? u : '';
}
function postCard(ds,id,p){
  var m=S.members[id]||{name:'?', badges:{}};
  var today=dstr(), blurIt = ds===today && ME && id!==ME.id && !myPost(today);
  var deskU=safeImg(p.desk), selfU=safeImg(p.selfie);
  var photos = deskU||selfU
    ? '<div class="post-photos'+(blurIt?' blurred':'')+'">'+
        (deskU?'<img class="post-desk" alt="Photo" src="'+deskU+'">':'')+
        (selfU?'<img class="post-selfie" alt="Selfie" src="'+selfU+'">':'')+
        (blurIt?'<div class="blur-note">Post yours to see everyone’s</div>':'')+
      '</div>'
    : '<div class="post-gone">Photo expired (7 days)</div>';
  return '<div class="card post" data-post="'+ds+'|'+id+'">'+
    '<div class="post-head">'+avatar(m,true)+
    '<div class="r-main"><div class="r-name">'+esc(m.name)+'</div>'+
    '<div class="r-sub num">'+fmtT(p.t)+'</div></div>'+
    (p.late?'<span class="tag late">late</span>':'<span class="tag ok">on time</span>')+'</div>'+
    photos+
    '<div class="reacts">'+REACT_SET.map(function(e){
      var who=reactWho(p,e);
      var mine=ME&&who.indexOf(ME.id)>=0;
      return '<button class="react'+(mine?' mine':'')+'" data-re="'+e+'" aria-label="React '+e+'">'+e+(who.length?' <span class="c num">'+who.length+'</span>':'')+'</button>';
    }).join('')+'</div></div>';
}
/* reactions live as keyed maps {memberId:true} so two people reacting at once
   write disjoint RTDB paths and can never clobber each other (legacy arrays read fine) */
function reactWho(p,e){
  var r=p&&p.reactions&&p.reactions[e]; if(!r) return [];
  if(Array.isArray(r)) return r.filter(Boolean);
  if(typeof r==='object') return Object.keys(r);
  return [];
}
var reactTimer=null, reactPending={};
function wireReacts(){
  $view.querySelectorAll('[data-post]').forEach(function(card){
    card.querySelector('.reacts').addEventListener('click',function(e){
      var b=e.target.closest('[data-re]'); if(!b||!ME) return;
      if(!guardWrite()) return;
      var bits=card.dataset.post.split('|'), p=S.posts[bits[0]][bits[1]], em=b.dataset.re;
      p.reactions=p.reactions||{};
      var cur=reactWho(p,em), had=cur.indexOf(ME.id)>=0;
      var obj={}; cur.forEach(function(x){ obj[x]=true; });
      if(had) delete obj[ME.id]; else obj[ME.id]=true;
      p.reactions[em]=obj;
      reactPending['posts/'+bits[0]+'/'+bits[1]+'/reactions/'+em+'/'+ME.id]= had ? null : true;
      clearTimeout(reactTimer); reactTimer=setTimeout(function(){ var o=reactPending; reactPending={}; persist(o); },1200);
      renderFeed();
    });
  });
}

var camStream=null, capSelfie=null, capDesk=null, capOnTime=false, capDs='';
function openComposer(){
  if(!ME){ toast('Join first.'); return; }
  if(!guardWrite()) return;
  capSelfie=null; capDesk=null;
  /* on-time is decided when you ANSWER the prompt, not when the upload finishes */
  capDs=dstr();
  capOnTime = minsNow() < mcMinutes(capDs)+2;
  camStep('user');
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(function(t){t.stop();}); camStream=null; } }
function camStep(facing){
  var isSelfie = facing==='user';
  var stage=document.createElement('div'); stage.className='cam-stage';
  stage.innerHTML='<div class="cam-label">'+(isSelfie?'1 of 2 — you':'2 of 2 — your view')+'</div>'+
    '<video autoplay playsinline muted></video>'+
    '<div class="cam-bar"><button class="cam-cancel" id="cCancel">Cancel</button>'+
    '<button class="shutter" id="cSnap" aria-label="Take photo"></button>'+
    '<button class="cam-cancel" id="cFile">Upload</button></div>'+
    '<input type="file" accept="image/*" capture="'+(isSelfie?'user':'environment')+'" class="hidden" id="cInput">';
  $layer.appendChild(stage);
  var video=stage.querySelector('video'), input=stage.querySelector('#cInput');
  var gotCam=false;
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:isSelfie?'user':'environment'}, audio:false})
      .then(function(st){ camStream=st; video.srcObject=st; gotCam=true; })
      .catch(function(){ input.click(); });
  } else { setTimeout(function(){ input.click(); },50); }
  function done(dataURI){
    stopCam(); stage.remove();
    if(isSelfie){ capSelfie=dataURI; camStep('environment'); }
    else{ capDesk=dataURI; reviewStep(); }
  }
  stage.querySelector('#cSnap').addEventListener('click',function(){
    if(!gotCam){ input.click(); return; }
    var c=document.createElement('canvas');
    var w=Math.min(480, video.videoWidth||480);
    var h=Math.round(w*(video.videoHeight||640)/(video.videoWidth||480));
    c.width=w; c.height=h;
    var ctx=c.getContext('2d');
    if(isSelfie){ ctx.translate(w,0); ctx.scale(-1,1); }
    ctx.drawImage(video,0,0,w,h);
    done(c.toDataURL('image/jpeg',0.55));
  });
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0]; if(!f) return;
    compressFile(f).then(done);
  });
  stage.querySelector('#cFile').addEventListener('click',function(){ input.click(); });
  stage.querySelector('#cCancel').addEventListener('click',function(){ stopCam(); stage.remove(); });
}
function compressFile(f){
  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){
      var w=Math.min(480,img.width), h=Math.round(w*img.height/img.width);
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg',0.55));
    };
    img.src=URL.createObjectURL(f);
  });
}
function reviewStep(){
  var stage=document.createElement('div'); stage.className='cam-stage';
  stage.innerHTML='<div class="rv-wrap">'+
      '<img class="rv-desk" alt="Photo" src="'+capDesk+'">'+
      (capSelfie?'<img class="rv-selfie" alt="Selfie" src="'+capSelfie+'">':'')+
    '</div>'+
    '<div class="cam-bar"><button class="cam-cancel" id="rRetake">Retake</button>'+
    '<button class="btn btn-in" id="rPost">Post</button></div>';
  $layer.appendChild(stage);
  stage.querySelector('#rRetake').addEventListener('click',function(){ stage.remove(); camStep('user'); });
  stage.querySelector('#rPost').addEventListener('click',function(){
    stage.remove(); filePost(capSelfie, capDesk);
  });
}
function filePost(selfie,desk){
  var today=dstr(), t=nowMs();
  var late = !(capOnTime && capDs===today);
  try{ sessionStorage.setItem(SS_DRAFT, JSON.stringify({ds:today,selfie:selfie,desk:desk,late:late,t:t})); }catch(e){}
  S.posts[today]=S.posts[today]||{};
  S.posts[today][ME.id]={t:t, late:late, selfie:selfie, desk:desk, reactions:{}};
  var P={}; P['posts/'+today+'/'+ME.id]={t:t, late:late, selfie:selfie, desk:desk};
  persist(merged(P, plog(S.members[ME.id].name+' posted')));
  try{ sessionStorage.removeItem(SS_DRAFT); }catch(e){}
  TAB='feed'; render();
  toast(late?'Posted (late).':'Posted.');
}
function restoreDraft(){
  try{
    var d=JSON.parse(sessionStorage.getItem(SS_DRAFT));
    if(d&&d.ds===dstr()&&!myPost(d.ds)){
      sessionStorage.removeItem(SS_DRAFT);
      capSelfie=d.selfie; capDesk=d.desk;
      toast('Your photo survived — post it.');
      reviewStep();
    }
  }catch(e){}
}

/* ───────────────────────── tickers ───────────────────────── */

setInterval(function(){
  document.querySelectorAll('[data-tick]').forEach(function(el){
    var k=el.dataset.tick;
    if(k==='sess'&&ME){ var a=activeSession(ME.id); if(a) el.textContent=fmtDur(nowMs()-a.s.i); }
    else if(k.indexOf('m-')===0){ var a2=activeSession(k.slice(2)); if(a2) el.textContent=fmtDur(nowMs()-a2.s.i); }
    else if(k==='mc'||k==='mc2'){
      var T=mcMinutes(dstr()), left=Math.max(0,Math.round((T+2-minsNow())*60));
      el.textContent=String(Math.floor(left/60))+':'+String(left%60).padStart(2,'0');
      if(left<=0&&k==='mc2'){ var sc=el.closest('.scrim'); if(sc) sc.remove(); }
    }
  });
  marginTick();
},1000);
setInterval(function(){ if(ME&&!document.querySelector('.scrim, .cam-stage')) render(); },60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S) render(); });

/* ───────────────────────── boot ───────────────────────── */

(async function boot(){
  try{
    if(window.claude&&window.claude.use){
      ART=await window.claude.use('artifact').catch(function(){return null;});
      DL=await window.claude.use('downloads').catch(function(){return null;});
    }
  }catch(e){}
  if(!ART) resolveRemote();  /* artifact CSP blocks external hosts, so remote only outside it */
  if(DB&&FLOOR){ MODE='remote'; await remoteLoad(); }
  else if(DB){ MODE='lobby'; }
  else if(ART){ MODE='shared'; S=await loadState(); }
  else{ MODE='solo'; S=loadLocalState()||defaultState(); }
  if(MODE!=='lobby'){ normalize(); ME=loadMe(); }
  if(MODE==='remote'){ loadPending(); applyPendingLocally(); normalize(); }
  render();
  if(MODE==='remote'){ startStream(); shredRemote(); flushRemote(); }
  restoreDraft();
  maybeCheer();
  console.info('[clocked-in] mode:',MODE,FLOOR||'');
})();
})();
</script>
