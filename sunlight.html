<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SunSpot · NYC Rooftop Sun, Ranked</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f7f6f3;
            --surface-2: #efede8;
            --line: #e7e4dd;
            --text: #1a1d21;
            --text-2: #5c6370;
            --text-3: #9aa1ab;
            --brand: #ff8a00;
            --brand-deep: #e07000;
            --brand-soft: #fff3e2;
            --gold: #ffb703;
            --green: #128a52;
            --green-lt: #7cb342;
            --amber: #f5a623;
            --shade: #aeb6bf;
            --navy: #14233c;
            --radius: 16px;
            --shadow-sm: 0 1px 2px rgba(20, 25, 35, 0.06), 0 2px 8px rgba(20, 25, 35, 0.05);
            --shadow-md: 0 4px 14px rgba(20, 25, 35, 0.10), 0 1px 3px rgba(20, 25, 35, 0.07);
            --shadow-lg: 0 12px 32px rgba(20, 25, 35, 0.16);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; }
        input { font-family: inherit; }

        /* ===== App shell ===== */
        .app {
            display: grid;
            grid-template-rows: 64px 1fr;
            grid-template-columns: 420px 1fr;
            grid-template-areas:
                "header header"
                "panel  map";
            height: 100%;
        }

        /* ===== Header ===== */
        .topbar {
            grid-area: header;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
            z-index: 30;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            user-select: none;
        }
        .logo-mark {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--gold), var(--brand));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 17px;
            box-shadow: 0 2px 8px rgba(255, 138, 0, 0.35);
        }
        .logo-name {
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.03em;
        }
        .logo-name span { color: var(--brand); }
        .logo-tag {
            font-size: 11px;
            color: var(--text-3);
            font-weight: 500;
            margin-top: 1px;
            white-space: nowrap;
        }

        .search-wrap {
            flex: 1;
            max-width: 420px;
            position: relative;
        }
        .search-wrap .icon {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            color: var(--text-3); font-size: 14px; pointer-events: none;
        }
        .search {
            width: 100%;
            border: 1.5px solid var(--line);
            background: var(--surface);
            border-radius: 12px;
            padding: 10px 14px 10px 36px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .search:focus { border-color: var(--brand); background: #fff; }
        .search::placeholder { color: var(--text-3); }

        .top-stats {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .stat-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
            white-space: nowrap;
        }
        .stat-chip .v { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; }
        .stat-chip.phase { background: var(--brand-soft); border-color: #ffd9a8; color: var(--brand-deep); }

        /* ===== Panel (ranked list) ===== */
        .panel {
            grid-area: panel;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border-right: 1px solid var(--line);
            overflow: hidden;
            z-index: 20;
        }

        .hero {
            margin: 14px 16px 0;
            border-radius: var(--radius);
            background: linear-gradient(120deg, #ffb703 0%, #ff8a00 60%, #ff6d1f 100%);
            color: #fff;
            padding: 16px 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 138, 0, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            overflow: hidden;
        }
        .hero:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(255, 138, 0, 0.38); }
        .hero::after {
            content: '☀';
            position: absolute;
            right: -8px; top: -18px;
            font-size: 92px;
            opacity: 0.18;
        }
        .hero .k {
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            opacity: 0.85;
        }
        .hero .pick {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 3px 0 2px;
        }
        .hero .sub {
            font-size: 12.5px;
            font-weight: 600;
            opacity: 0.92;
        }

        .panel-controls {
            padding: 14px 16px 10px;
        }
        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chip {
            border: 1.5px solid var(--line);
            background: #fff;
            color: var(--text-2);
            font-size: 12.5px;
            font-weight: 600;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .chip:hover { border-color: #d9d4c9; color: var(--text); }
        .chip.active {
            background: var(--navy);
            border-color: var(--navy);
            color: #fff;
        }
        .list-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 2px 0;
        }
        .list-meta .count {
            font-size: 12px;
            color: var(--text-3);
            font-weight: 600;
        }
        .sort {
            display: flex;
            gap: 2px;
            background: var(--surface);
            border-radius: 9px;
            padding: 3px;
        }
        .sort button {
            border: none;
            background: transparent;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-3);
            padding: 5px 11px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .sort button.active {
            background: #fff;
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }

        .list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px 90px;
            scrollbar-width: thin;
            scrollbar-color: #d9d4c9 transparent;
            -webkit-overflow-scrolling: touch;
        }
        .list::-webkit-scrollbar { width: 5px; }
        .list::-webkit-scrollbar-thumb { background: #ddd8cd; border-radius: 3px; }

        .card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 10px 13px 6px;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.13s ease;
            border-bottom: 1px solid #f1efe9;
        }
        .card:hover { background: var(--surface); }
        .card.active { background: var(--brand-soft); }

        .rank {
            width: 26px;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            color: var(--text-3);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }
        .card.top3 .rank { color: var(--brand); }

        .card-body { flex: 1; min-width: 0; }
        .card-name {
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta {
            font-size: 12px;
            color: var(--text-2);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta b { color: var(--text-2); font-weight: 600; }
        .card-sun {
            font-size: 11.5px;
            margin-top: 3px;
            font-weight: 600;
            color: var(--brand-deep);
        }
        .card-sun.shaded { color: var(--text-3); }
        .card-sun.closed { color: var(--text-3); font-style: italic; }

        .bubble {
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            box-shadow: var(--shadow-sm);
        }

        .type-pill {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 7px;
            border-radius: 5px;
            vertical-align: 1px;
            margin-right: 5px;
        }
        .type-pill.rooftop { background: #fff0dd; color: #c46a00; }
        .type-pill.patio   { background: #e8eefb; color: #3b66c4; }
        .type-pill.garden  { background: #e5f4e3; color: #2e7d32; }
        .type-pill.water   { background: #e0f3f9; color: #0277a8; }

        .empty {
            text-align: center;
            color: var(--text-3);
            font-size: 13px;
            padding: 40px 20px;
            font-weight: 500;
        }

        /* ===== Map ===== */
        .map-area { grid-area: map; position: relative; overflow: hidden; }
        #map { position: absolute; inset: 0; background: #eae6df; }
        #map-tint {
            position: absolute; inset: 0;
            pointer-events: none;
            z-index: 1;
            transition: background 0.5s ease;
            background: transparent;
        }

        .map-buttons {
            position: absolute;
            top: 16px; right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }
        .map-btn {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.15s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .map-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
        .map-btn.on { background: var(--brand-soft); border-color: #ffd9a8; color: var(--brand-deep); }

        .legend {
            position: absolute;
            right: 16px;
            bottom: 118px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            z-index: 5;
            box-shadow: var(--shadow-md);
            font-size: 11.5px;
            color: var(--text-2);
            font-weight: 600;
        }
        .legend .h {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-3);
            margin-bottom: 8px;
        }
        .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .legend-row:last-child { margin-bottom: 0; }
        .legend-b {
            width: 20px; height: 20px;
            border-radius: 50%;
            color: #fff;
            font-size: 8.5px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* ===== Time console ===== */
        .console {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: min(720px, calc(100% - 32px));
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            padding: 13px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 6;
        }
        .date-ctl {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex-shrink: 0;
        }
        .date-ctl label {
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-3);
        }
        .date-ctl input {
            border: none;
            background: transparent;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            color-scheme: light;
            cursor: pointer;
            outline: none;
            padding: 0;
        }

        .slider-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .slider-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-3);
            font-family: 'JetBrains Mono', monospace;
        }
        .slider-top .mid {
            color: var(--text);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .slider-track { position: relative; height: 22px; display: flex; align-items: center; }
        .track-bg {
            position: absolute;
            left: 0; right: 0;
            height: 8px;
            top: 7px;
            border-radius: 999px;
            background: linear-gradient(90deg,
                #dfe3ec 0%, #e8e0ee 16%,
                #ffd9a0 26%, #ffc24d 38%,
                #ffd76e 50%, #ffc24d 62%,
                #ff9e54 74%, #d9b8e0 84%,
                #dfe3ec 100%);
        }
        .tick {
            position: absolute;
            top: 4px;
            width: 2px; height: 14px;
            background: rgba(20, 29, 50, 0.32);
            border-radius: 1px;
            transform: translateX(-1px);
            pointer-events: none;
        }
        .tick.golden { background: var(--brand); }
        input[type="range"].slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            height: 22px;
            margin: 0;
            position: relative;
            z-index: 2;
            cursor: grab;
        }
        input[type="range"].slider:active { cursor: grabbing; }
        input[type="range"].slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--brand);
            box-shadow: 0 2px 8px rgba(255, 138, 0, 0.4);
        }
        input[type="range"].slider::-moz-range-thumb {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--brand);
            box-shadow: 0 2px 8px rgba(255, 138, 0, 0.4);
        }

        .console-actions { display: flex; gap: 7px; flex-shrink: 0; }
        .btn {
            border: 1.5px solid var(--line);
            background: #fff;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            padding: 9px 14px;
            border-radius: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn:hover { border-color: #d4cfc4; background: var(--surface); }
        .btn.primary {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
            box-shadow: 0 2px 10px rgba(255, 138, 0, 0.35);
        }
        .btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
        .btn.icon { padding: 9px 12px; }

        /* ===== Popup ===== */
        .maplibregl-popup-content {
            background: #fff !important;
            color: var(--text);
            border-radius: 16px !important;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-lg) !important;
            padding: 16px 17px !important;
            font-family: inherit;
            min-width: 250px;
            max-width: 300px;
        }
        .maplibregl-popup-tip { display: none !important; }
        .maplibregl-popup-close-button {
            color: var(--text-3) !important;
            font-size: 19px !important;
            padding: 5px 9px !important;
            right: 2px !important; top: 2px !important;
        }
        .pp-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
        .pp-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; flex: 1; padding-right: 12px; }
        .pp-addr { font-size: 11.5px; color: var(--text-3); font-weight: 600; margin-bottom: 9px; }
        .pp-row { font-size: 12.5px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; display: flex; gap: 7px; align-items: center; }
        .pp-row .dot { color: var(--brand); }
        .pp-vibe {
            font-size: 12.5px; color: var(--text-2);
            font-style: italic; line-height: 1.45;
            border-top: 1px solid var(--line);
            margin-top: 9px; padding-top: 9px;
        }
        .pp-actions { display: flex; gap: 7px; margin-top: 11px; }
        .pp-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 0;
            border-radius: 10px;
            background: var(--brand);
            color: #fff !important;
            transition: background 0.15s ease;
        }
        .pp-btn:hover { background: var(--brand-deep); }
        .pp-btn.alt { background: var(--surface); color: var(--text) !important; border: 1px solid var(--line); }
        .pp-btn.alt:hover { background: var(--surface-2); }

        /* ===== Map pins ===== */
        .pin {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .pin-bubble {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2.5px solid #fff;
            color: #fff;
            font-weight: 800;
            font-size: 10.5px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(20, 25, 35, 0.3);
            transition: transform 0.15s ease, background 0.25s ease;
            font-variant-numeric: tabular-nums;
        }
        .pin:hover .pin-bubble { transform: scale(1.25); }
        .pin.home .pin-bubble {
            background: var(--navy);
            font-size: 13px;
        }

        /* ===== Mobile nav ===== */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: calc(12px + var(--sab));
            left: 50%;
            transform: translateX(-50%);
            background: var(--navy);
            border-radius: 999px;
            padding: 5px;
            gap: 4px;
            z-index: 60;
            box-shadow: var(--shadow-lg);
        }
        .mobile-nav button {
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
            font-weight: 700;
            padding: 10px 26px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .mobile-nav button.active { background: var(--brand); color: #fff; }

        /* ===== Loading ===== */
        .loading {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loading .ball {
            width: 44px; height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold), var(--brand));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 22px;
            box-shadow: 0 6px 24px rgba(255, 138, 0, 0.45);
            animation: bob 1.3s ease-in-out infinite;
        }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .loading .t { font-size: 13px; font-weight: 700; color: var(--text-2); }

        .maplibregl-ctrl-attrib { background: rgba(255,255,255,0.75) !important; }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .app {
                grid-template-rows: 56px 1fr;
                grid-template-columns: 1fr;
                grid-template-areas: "header" "main";
            }
            .topbar { padding: 0 14px; gap: 10px; }
            .logo-tag { display: none; }
            .top-stats .stat-chip:not(.phase) { display: none; }
            .search-wrap { max-width: none; }

            .panel, .map-area { grid-area: main; }
            .panel { border-right: none; }
            body.view-map .panel { display: none; }
            body.view-list .map-area { visibility: hidden; }

            .mobile-nav { display: flex; }
            .list { padding-bottom: calc(86px + var(--sab)); }

            .console {
                bottom: calc(74px + var(--sab));
                width: calc(100% - 24px);
                padding: 10px 14px;
                gap: 10px;
                flex-wrap: wrap;
            }
            .console .date-ctl { order: 2; }
            .console .console-actions { order: 3; margin-left: auto; }
            .console .slider-wrap { order: 1; flex-basis: 100%; }
            .legend { display: none; }
            .map-buttons { top: 12px; right: 12px; }
            .hero { margin: 12px 12px 0; }
            .panel-controls { padding: 12px 12px 8px; }
        }
    </style>
</head>
<body class="view-list">
    <div class="loading" id="loading">
        <div class="ball">☀</div>
        <div class="t">Finding the sun…</div>
    </div>

    <div class="app">
        <header class="topbar">
            <div class="logo">
                <div class="logo-mark">☀</div>
                <div>

map.on('load', () => {

    const sources = map.getStyle().sources || {};
    const vecs = Object.keys(sources).filter(s => sources[s].type === 'vector');
    let bSource = null, bLayer = null;
    for (const s of vecs) {
        const ids = map.getSource(s)?.vectorLayerIds;
        if (!ids) continue;
        if (ids.includes('building')) { bSource = s; bLayer = 'building'; break; }
        if (ids.includes('buildings')) { bSource = s; bLayer = 'buildings'; break; }

    if (!bSource && vecs.length) { bSource = vecs[0]; bLayer = 'building'; }

    if (bSource) {

function circleCoords(lng, lat, km, n = 64) {
    const out = [];
    const dLat = km / 110.574, dLng = km / (111.32 * Math.cos(lat * Math.PI / 180));
    for (let i = 0; i <= n; i++) {
        const a = (i / n) * 2 * Math.PI;
        out.push([lng + dLng * Math.cos(a), lat + dLat * Math.sin(a)]);
    }
    return out;
}

function addWalkRings() {
    const ring = km => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [circleCoords(HOME.lng, HOME.lat, km)] } });
    map.addSource('walk-rings', { type: 'geojson', data: { type: 'FeatureCollection', features: [ring(0.4), ring(0.8), ring(1.6)] } });
    map.addLayer({
        id: 'walk-rings-line', type: 'line', source: 'walk-rings',
        paint: { 'line-color': '#14233c', 'line-opacity': 0.14, 'line-width': 1.2, 'line-dasharray': [2, 4] }
    }, buildingsLayerId || undefined);
}

/* ============= SUN MATH ============= */
function currentDateTime() {
    const d = new Date(state.date);
    d.setHours(Math.floor(state.minutes / 60), state.minutes % 60, 0, 0);
    return d;
}

function sunScore(patio, when) {
    const month = when.getMonth() + 1;
    if (patio.season && !patio.season.includes(month)) return -1;   // closed

    const sun = SunCalc.getPosition(when, patio.lat, patio.lng);
    const altDeg = sun.altitude * 180 / Math.PI;
    if (altDeg < -3) return 0;
    const azDeg = (sun.azimuth * 180 / Math.PI + 180 + 360) % 360;

    let inWindow = false;
    for (const [a, b] of patio.windows) {
        if (a <= b) { if (azDeg >= a && azDeg <= b) inWindow = true; }
        else        { if (azDeg >= a || azDeg <= b) inWindow = true; }
    }

    if (altDeg < 0) {
        const glow = Math.max(0, (altDeg + 3) / 3) * 22;
        return Math.round(glow * (inWindow ? 1 : 0.55));
    }

    let score;
    if (altDeg > 45) {
        score = 70 + (patio.type === 'rooftop' ? 12 : 0);
    } else if (altDeg > 12) {
        score = 60 + (inWindow ? 18 : -10);
    } else {
        score = 50 + (inWindow ? 32 : -8) + Math.max(0, 12 - altDeg) * 0.8;
        if (patio.type === 'rooftop' && inWindow) score += 8;
        if (patio.type === 'water' && inWindow) score += 6;
    }
    if (!inWindow) score -= 12;
    return Math.max(0, Math.min(100, Math.round(score)));
}

/* Beli-style bubble color buckets (display scale = score/10) */
function bubbleColor(s) {
    if (s < 0) return '#d4d8de';
    if (s >= 80) return '#128a52';
    if (s >= 65) return '#7cb342';
    if (s >= 40) return '#f5a623';
    return '#aeb6bf';
}
function displayScore(s) { return s < 0 ? '–' : (s / 10).toFixed(1); }

/* Daily sun window per patio: when does score stay ≥ 50? */
let sunWindows = new Map();
function computeSunWindows() {
    sunWindows = new Map();
    PATIOS.forEach(p => {
        let from = null, to = null, closed = false;
        const d = new Date(state.date);
        if (p.season && !p.season.includes(d.getMonth() + 1)) { sunWindows.set(p.name, { closed: true }); return; }
        for (let m = 11 * 60; m <= 21.5 * 60; m += 5) {
            const t = new Date(state.date);
            t.setHours(Math.floor(m / 60), m % 60, 0, 0);
            if (sunScore(p, t) >= 50) {
                if (!from) from = new Date(t);
                to = new Date(t);
            }
        }
        sunWindows.set(p.name, { from, to, closed });
    });
}

/* ============= MAP LIGHT + TINT ============= */
function applyMapLight(when) {
    const sun = SunCalc.getPosition(when, HOME.lat, HOME.lng);
    const altDeg = sun.altitude * 180 / Math.PI;
    const azDeg = (sun.azimuth * 180 / Math.PI + 180 + 360) % 360;
    const tint = document.getElementById('map-tint');

    let color, intensity;
    if (altDeg < -6)      { color = '#aab6d4'; intensity = 0.12; tint.style.background = 'rgba(18, 28, 58, 0.35)'; }
    else if (altDeg < 0)  { color = '#c9a8d8'; intensity = 0.3;  tint.style.background = 'rgba(120, 80, 150, 0.16)'; }
    else if (altDeg < 6)  { color = '#ff8c4a'; intensity = 0.6;  tint.style.background = 'rgba(255, 115, 40, 0.12)'; }
    else if (altDeg < 14) { color = '#ffb35c'; intensity = 0.66; tint.style.background = 'rgba(255, 170, 60, 0.08)'; }
    else if (altDeg < 30) { color = '#ffd391'; intensity = 0.6;  tint.style.background = 'transparent'; }
    else                  { color = '#fff3d6'; intensity = 0.5;  tint.style.background = 'transparent'; }

    const polar = Math.max(5, Math.min(85, 90 - altDeg));
    try { map.setLight({ anchor: 'map', color, intensity, position: [1.4, azDeg, polar] }); } catch (e) {}
    return { altDeg, azDeg };
}

function updateSunRays(altDeg, azDeg, scored) {
    const src = map.getSource('sun-rays');
    if (!src) return;
    if (!state.raysOn || altDeg < 0) { src.setData({ type: 'FeatureCollection', features: [] }); return; }
    const dx = Math.sin(azDeg * Math.PI / 180), dy = Math.cos(azDeg * Math.PI / 180);
    const reach = 0.0022;
    const features = scored.filter(x => x.score >= 50).map(({ p, score }) => ({
        type: 'Feature',
        properties: { width: 1 + score / 60, opacity: 0.12 + score / 350 },
        geometry: { type: 'LineString', coordinates: [[p.lng + dx * reach, p.lat + dy * reach], [p.lng, p.lat]] }
    }));
    src.setData({ type: 'FeatureCollection', features });
}

/* ============= HELPERS ============= */
function distanceMeters(a, b) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}
const walkMins = p => Math.max(1, Math.round(distanceMeters(HOME, p) / 80));

function formatTime(d) {
    if (!d || isNaN(d.getTime())) return '—';
    let h = d.getHours(); const m = d.getMinutes();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = ((h + 11) % 12) + 1;
    return `${h}:${String(m).padStart(2, '0')} ${ap}`;
}

    const when = currentDateTime();
    const score = sunScore(p, when);
    const w = sunWindows.get(p.name) || {};
    const sunLine = w.closed
        ? 'Closed for the season'
        : (w.to ? `Sun today until <b>${formatTime(w.to)}</b>` : 'In shade today');
    const gmaps = `https://maps.apple.com/?daddr=${p.lat},${p.lng}&dirflg=w`;

    activePopup = new maplibregl.Popup({ offset: 20, closeButton: true, maxWidth: '310px' })
        .setLngLat([p.lng, p.lat])
        .setHTML(`
            <div class="pp-head">
                <div class="pp-name">${p.name}</div>
                <div class="bubble" style="width:38px;height:38px;font-size:13px;background:${bubbleColor(score)}">${displayScore(score)}</div>
            </div>
            <div class="pp-addr">${p.addr} · ${p.hood}</div>
            <div class="pp-row"><span class="type-pill ${p.type}">${typeLabel[p.type]}</span> Floor ${p.floor} · ${walkMins(p)} min walk</div>
            <div class="pp-row"><span class="dot">☀</span> <span>${sunLine}</span></div>
            <div class="pp-vibe">${p.vibe}</div>
            <div class="pp-actions">
                <a class="pp-btn" href="${gmaps}" target="_blank" rel="noopener">Directions</a>
                <a class="pp-btn alt" href="https://www.google.com/search?q=${encodeURIComponent(p.name + ' NYC reservations')}" target="_blank" rel="noopener">Reserve</a>
            </div>
        `)
        .addTo(map);

    renderList(lastScored);
    const row = document.querySelector(`[data-name="${CSS.escape(p.name)}"]`);
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    if (document.body.classList.contains('view-list') && window.innerWidth <= 900 && !fly) return;
    if (window.innerWidth <= 900) setView('map');
}

/* ============= LIST ============= */
let lastScored = [];
function renderList(scored) {
    const list = document.getElementById('list');
    const q = state.query.trim().toLowerCase();
    let rows = scored.filter(({ p }) =>
        (state.filter === 'all' || p.type === state.filter) &&
        (!q || p.name.toLowerCase().includes(q) || p.hood.toLowerCase().includes(q))
    );
    if (state.sort === 'walk') rows = [...rows].sort((a, b) => walkMins(a.p) - walkMins(b.p));

    document.getElementById('count').textContent =
        `${rows.length} spot${rows.length === 1 ? '' : 's'} · ranked at ${formatTime(currentDateTime())}`;

    list.innerHTML = rows.map(({ p, score }, i) => {
        const w = sunWindows.get(p.name) || {};
        let sunLine, cls = '';
        if (w.closed)      { sunLine = `Seasonal · opens May`; cls = 'closed'; }
        else if (w.to)     { sunLine = `☀ Sun until ${formatTime(w.to)}`; }
        else               { sunLine = `In shade today`; cls = 'shaded'; }
        return `
        <div class="card ${i < 3 ? 'top3' : ''} ${state.activePatio === p.name ? 'active' : ''}" data-name="${p.name}">
            <div class="rank">${i + 1}</div>
            <div class="card-body">
                <div class="card-name">${p.name}</div>
                <div class="card-meta"><span class="type-pill ${p.type}">${typeLabel[p.type]}</span>${p.hood} · ${walkMins(p)} min walk</div>
                <div class="card-sun ${cls}">${sunLine}</div>
            </div>
            <div class="bubble" style="background:${bubbleColor(score)}">${displayScore(score)}</div>
        </div>`;
    }).join('') || `<div class="empty">No spots match. Try clearing filters.</div>`;

    list.querySelectorAll('.card').forEach(el => {
        el.addEventListener('click', () => {
            const p = PATIOS.find(x => x.name === el.dataset.name);
            if (p) selectPatio(p, true);
        });
    });
}

/* ============= HERO ============= */
function updateHero(times) {
    /* Tonight's pick = best score at golden hour */
    const gh = times.goldenHour;
    if (isNaN(gh?.getTime())) return;
    const best = PATIOS
        .map(p => ({ p, score: sunScore(p, gh) }))
        .sort((a, b) => b.score - a.score)[0];
    document.getElementById('hero-pick').textContent = best.p.name;
    document.getElementById('hero-sub').textContent =
        `${displayScore(best.score)} at golden hour (${formatTime(gh)}) · ${best.p.hood} · ${walkMins(best.p)} min walk`;
    document.getElementById('hero').onclick = () => {
        state.minutes = gh.getHours() * 60 + gh.getMinutes();
        document.getElementById('time-slider').value = state.minutes;
        update();
        selectPatio(best.p, true);
    };
}

/* ============= UPDATE ============= */
function update() {
    const when = currentDateTime();
    const { altDeg, azDeg } = applyMapLight(when);
    const times = SunCalc.getTimes(when, HOME.lat, HOME.lng);

    document.getElementById('rise-time').textContent = formatTime(times.sunrise);
    document.getElementById('set-time').textContent = formatTime(times.sunset);
    document.getElementById('clock').textContent = formatTime(when);
    document.getElementById('stat-sunset').textContent = formatTime(times.sunset);
    document.getElementById('stat-golden').textContent = formatTime(times.goldenHour);
    document.getElementById('stat-phase').textContent = phaseFor(altDeg, when, times);

    const scored = PATIOS.map(p => ({ p, score: sunScore(p, when) })).sort((a, b) => b.score - a.score);
    lastScored = scored;

    scored.forEach(({ p, score }) => {
        const pin = pins.get(p.name);
        if (!pin) return;
        pin.bubble.style.background = bubbleColor(score);
        pin.bubble.textContent = displayScore(score);
        pin.bubble.style.opacity = score < 20 && score >= 0 ? 0.75 : 1;
    });

    updateSunRays(altDeg, azDeg, scored);
    placeTicks(times);
    renderList(scored);
    updateHero(times);
}

function phaseFor(altDeg, when, times) {
    const t = when.getTime();
    if (altDeg < -6) return '🌙 Night';
    if (altDeg < 0) return t < times.sunrise.getTime() ? '🌅 Dawn' : '🌆 Dusk';
    if (altDeg < 6) return t < times.solarNoon.getTime() ? '🌅 Sunrise' : '🌇 Sunset';
    if (altDeg < 14) return '✨ Golden hour';
    if (altDeg > 55) return '☀ Midday';
    return '☀ Daylight';
}

function placeTicks(times) {
    const slider = document.getElementById('time-slider');
    const w = slider.clientWidth;
    const put = (id, d) => {
        if (!d || isNaN(d.getTime())) return;
        const m = d.getHours() * 60 + d.getMinutes();
        document.getElementById(id).style.left = (m / 1439) * w + 'px';
    };
    put('tick-rise', times.sunrise);
    put('tick-noon', times.solarNoon);
    put('tick-golden', times.goldenHour);
    put('tick-set', times.sunset);
}

/* ============= EVENTS ============= */
document.getElementById('time-slider').addEventListener('input', e => {
    state.minutes = +e.target.value;
    update();
});

document.getElementById('date-input').addEventListener('change', e => {
    if (!e.target.value) return;
    const [y, m, d] = e.target.value.split('-').map(Number);
    state.date = new Date(y, m - 1, d);
    computeSunWindows();
    update();
});

document.getElementById('golden-btn').addEventListener('click', () => {
    const times = SunCalc.getTimes(currentDateTime(), HOME.lat, HOME.lng);
    if (!isNaN(times.goldenHour.getTime())) {
        state.minutes = times.goldenHour.getHours() * 60 + times.goldenHour.getMinutes();
        document.getElementById('time-slider').value = state.minutes;
        update();
    }
});

document.getElementById('now-btn').addEventListener('click', () => {
    const n = new Date();
    state.minutes = n.getHours() * 60 + n.getMinutes();
    document.getElementById('time-slider').value = state.minutes;
    update();
});

document.getElementById('play-btn').addEventListener('click', () => {
    state.playing = !state.playing;
    const btn = document.getElementById('play-btn');
    if (state.playing) {
        btn.textContent = '❚❚';
        state.playInterval = setInterval(() => {
            state.minutes = (state.minutes + 4) % 1440;
            document.getElementById('time-slider').value = state.minutes;
            update();
        }, 90);
    } else {
        btn.textContent = '▶';
        clearInterval(state.playInterval);
    }
});

document.getElementById('recenter').addEventListener('click', () =>
    map.flyTo({ center: [HOME.lng, HOME.lat], zoom: 13.6, pitch: 52, bearing: -16, duration: 1100 }));

document.getElementById('toggle-3d').addEventListener('click', () =>
    map.easeTo({ pitch: map.getPitch() > 10 ? 0 : 52, duration: 600 }));

document.getElementById('toggle-rays').addEventListener('click', e => {
    state.raysOn = !state.raysOn;
    e.currentTarget.classList.toggle('on', state.raysOn);
    update();
});

document.querySelectorAll('#filters .chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('#filters .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.filter = chip.dataset.filter;
        renderList(lastScored);
    });
});

document.querySelectorAll('.sort button').forEach(b => {
    b.addEventListener('click', () => {
        document.querySelectorAll('.sort button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        state.sort = b.dataset.sort;
        renderList(lastScored);
    });
});

document.getElementById('search').addEventListener('input', e => {
    state.query = e.target.value;
    renderList(lastScored);
});

/* Mobile view switch */
function setView(v) {
    document.body.classList.toggle('view-map', v === 'map');
    document.body.classList.toggle('view-list', v === 'list');
    document.getElementById('nav-map').classList.toggle('active', v === 'map');
    document.getElementById('nav-list').classList.toggle('active', v === 'list');
    if (v === 'map') setTimeout(() => map.resize(), 60);
}
document.getElementById('nav-map').addEventListener('click', () => setView('map'));
document.getElementById('nav-list').addEventListener('click', () => setView('list'));

window.addEventListener('resize', () => placeTicks(SunCalc.getTimes(currentDateTime(), HOME.lat, HOME.lng)));

/* ============= INIT ============= */
(function init() {
    const today = new Date();
    const start = new Date(today.getFullYear(), 4, 1);        // May 1
    const end = new Date(today.getFullYear(), 10, 1);         // Nov 1
    let d = (today >= start && today <= end) ? today : new Date(today.getFullYear(), 4, 15);
    state.date = new Date(d.getFullYear(), d.getMonth(), d.getDate());

    const di = document.getElementById('date-input');
    di.min = `${today.getFullYear()}-05-01`;
    di.max = `${today.getFullYear()}-11-01`;
    di.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    /* Default to early evening; if it's evening right now, use the real time */
    const nowMin = today.getHours() * 60 + today.getMinutes();
    state.minutes = (nowMin >= 16 * 60 && nowMin <= 21 * 60) ? nowMin : 18 * 60;
    document.getElementById('time-slider').value = state.minutes;

    if (window.innerWidth <= 900) setView('list');
    computeSunWindows();
})();
</script>
</body>
</html>
